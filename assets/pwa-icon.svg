<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ClearKorea icon</title>
  <desc id="desc">A clean flat taegeuk-inspired ClearKorea mark in red, blue, and white.</desc>
  <defs>
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <circle cx="512" cy="512" r="372" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-opacity="0.96" filter="url(#rimGlow)"/>
    <clipPath id="markClip">
      <circle cx="512" cy="512" r="344"/>
    </clipPath>

    <g clip-path="url(#markClip)">
      <path d="M512 168
               A344 344 0 0 1 512 856
               A172 172 0 0 0 512 512
               A172 172 0 0 1 512 168Z"
            fill="#CD2E3A"/>
      <path d="M512 856
               A344 344 0 0 1 512 168
               A172 172 0 0 0 512 512
               A172 172 0 0 1 512 856Z"
            fill="#0047A0"/>
      <circle cx="512" cy="340" r="172" fill="#CD2E3A"/>
      <circle cx="512" cy="684" r="172" fill="#0047A0"/>
    </g>
  </g>
</svg>
