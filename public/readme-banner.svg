<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ClearKorea</title>
  <desc id="desc">Open-source civic transparency platform for lawful participation, rally support, livestreams, verified posts, and world press tracking.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="74%" cy="45%" r="58%">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.46" stop-color="#080B10"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="redTrail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#CD2E3A" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#CD2E3A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF4B55" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="blueTrail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0047A0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E88FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0047A0" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bgGlow)"/>
  <rect width="1200" height="360" fill="#0A0A0A" opacity="0.72"/>
  <g opacity="0.55">
    <circle cx="1018" cy="52" r="2" fill="#FFFFFF"/>
    <circle cx="907" cy="93" r="1.8" fill="#FFFFFF"/>
    <circle cx="1088" cy="168" r="1.7" fill="#CD2E3A"/>
    <circle cx="816" cy="238" r="1.7" fill="#1E88FF"/>
    <circle cx="985" cy="289" r="1.5" fill="#FFFFFF"/>
    <circle cx="675" cy="78" r="1.3" fill="#FFFFFF"/>
    <circle cx="742" cy="312" r="1.2" fill="#CD2E3A"/>
    <circle cx="1137" cy="292" r="1.3" fill="#FFFFFF"/>
  </g>
  <g filter="url(#softGlow)" opacity="0.88">
    <path d="M560 92 C690 14 835 28 955 116 C1025 168 1096 172 1172 133" fill="none" stroke="url(#redTrail)" stroke-width="18" stroke-linecap="round"/>
    <path d="M520 258 C650 342 835 328 944 226 C1015 160 1090 148 1174 184" fill="none" stroke="url(#blueTrail)" stroke-width="18" stroke-linecap="round"/>
    <path d="M585 132 C713 72 838 84 925 153 C991 205 1069 217 1164 198" fill="none" stroke="#CD2E3A" stroke-width="3" stroke-linecap="round" opacity="0.58"/>
    <path d="M580 231 C704 284 837 270 924 199 C994 143 1071 130 1161 153" fill="none" stroke="#1E88FF" stroke-width="3" stroke-linecap="round" opacity="0.62"/>
  </g>
  <g transform="translate(816 80)">
    <circle cx="120" cy="100" r="92" fill="#05070B" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M120 8 A92 92 0 0 1 120 192 A46 46 0 0 0 120 100 A46 46 0 0 1 120 8" fill="#CD2E3A"/>
    <path d="M120 192 A92 92 0 0 1 120 8 A46 46 0 0 0 120 100 A46 46 0 0 1 120 192" fill="#0047A0"/>
    <circle cx="120" cy="54" r="46" fill="#CD2E3A"/>
    <circle cx="120" cy="146" r="46" fill="#0047A0"/>
    <circle cx="120" cy="100" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
  </g>
  <g filter="url(#textShadow)">
    <text x="72" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">ClearKorea</text>
    <text x="76" y="177" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#B8BDC7">Your voice, on the record.</text>
    <text x="76" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#E6E8EC">Open-source civic transparency platform</text>
    <text x="76" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#A1A1AA">Lawful participation · verified posts · rally support · world press tracking</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
