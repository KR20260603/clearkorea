    <rect x="188" y="286" width="108" height="30" rx="15" fill="#CD2E3A" fill-opacity="0.14" stroke="#CD2E3A" stroke-opacity="0.38"/>
    <text x="242" y="306" fill="#FFD8DC" text-anchor="middle">Public repo</text>
    <rect x="312" y="286" width="150" height="30" rx="15" fill="#0047A0" fill-opacity="0.18" stroke="#1E88FF" stroke-opacity="0.38"/>
    <text x="387" y="306" fill="#D9EAFF" text-anchor="middle">Contributions open</text>
  </g>
</svg>
